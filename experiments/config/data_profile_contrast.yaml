# ============================================================
# Contraste de perfiles de demanda (stable vs seasonal)
# ============================================================
# Objetivo:
#   Medir sensibilidad de resultados e hipotesis a la estructura
#   de datos sinteticos (demanda estable vs estacional).
#
# Recomendacion:
#   Ejecutar con resume y paralelismo:
#   python experiments/scripts/run_data_profile_contrast.py --resume --workers -1
# ============================================================

experiment:
  name: "data_profile_contrast_v1"
  size_profiles: ["small", "medium"]
  demand_profiles: ["stable", "seasonal"]
  instance_seeds: [42]
  run_seeds: [1, 2, 3, 4, 5]
  n_replicas: 5
  deterministic_algorithms: ["cbc_exact"]
  checkpoint_every: 10

generation:
  distribution: "lognormal"

algorithms:
  baseline:
    class: "Baseline"
    params:
      strategy: "best"

  ga:
    class: "GeneticAlgorithm"
    params:
      pop_size: 80
      crossover_rate: 0.7437
      mutation_rate: 0.0889
      elitism_count: 3
      selection_size: 3
      n_generations: 120
      stagnation_limit: 40

  sa:
    class: "SimulatedAnnealing"
    params:
      T_initial: 203952.18
      T_final: 586.35
      cooling_rate: 0.7817
      delta: 0.0661
      max_iterations: 27
      p_quantity: 0.2825
      p_toggle: 0.4941
      reheat_factor: 1.287
      reheat_threshold: 54

  de:
    class: "DifferentialEvolution"
    params:
      pop_size: 51
      CR: 0.5112
      F: 0.3165
      strategy: "best/1/bin"
      max_generations: 120
      stagnation_limit: 40

  ga_sa:
    class: "HybridGASA"
    params:
      pop_size: 39
      crossover_rate: 0.8589
      mutation_rate: 0.0505
      elitism_count: 1
      selection_size: 3
      local_search_T: 3226.60
      local_search_cooling: 0.7126
      local_search_freq: 9
      local_search_iters: 26
      local_search_top_k: 10
      n_generations: 120
      stagnation_limit: 40

  cbc_exact:
    class: "ExactSolver"
    params:
      time_limit: 240
      solver: "cbc"

output:
  runs_csv: "experiments/results/data_profile_contrast_runs.csv"
  summary_csv: "experiments/results/data_profile_contrast_summary.csv"
  paired_csv: "experiments/results/data_profile_contrast_paired.csv"
  paired_summary_csv: "experiments/results/data_profile_contrast_paired_summary.csv"
  hypotheses_json: "experiments/results/data_profile_contrast_hypotheses.json"
  report_md: "experiments/results/data_profile_contrast_report.md"
  checkpoint_json: "experiments/results/checkpoints/data_profile_contrast_checkpoint.json"
