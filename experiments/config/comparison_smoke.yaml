experiment:
  name: comparison_smoke
  description: Comparacion rigurosa de metaheuristicas vs baseline y solver exacto
  n_replicas: 1
  seeds:
  - 1
  time_limit_seconds: 60
  checkpoint_every: 2
algorithms:
  ga:
    class: GeneticAlgorithm
    params:
      pop_size: 80
      crossover_rate: 0.7437
      mutation_rate: 0.0889
      elitism_count: 3
      selection_size: 3
      n_generations: 200
      stagnation_limit: 50
  sa:
    class: SimulatedAnnealing
    params:
      T_initial: 203952.18
      T_final: 586.35
      cooling_rate: 0.7817
      delta: 0.0661
      max_iterations: 27
      p_quantity: 0.2825
      p_toggle: 0.4941
      reheat_factor: 1.287
      reheat_threshold: 54
  de:
    class: DifferentialEvolution
    params:
      pop_size: 51
      CR: 0.5112
      F: 0.3165
      strategy: best/1/bin
      max_generations: 200
      stagnation_limit: 50
  ga_sa:
    class: HybridGASA
    params:
      pop_size: 39
      crossover_rate: 0.8589
      mutation_rate: 0.0505
      elitism_count: 1
      selection_size: 3
      local_search_T: 3226.6
      local_search_cooling: 0.7126
      local_search_freq: 9
      local_search_iters: 26
      local_search_top_k: 10
      n_generations: 200
      stagnation_limit: 50
  cbc_exact:
    class: ExactSolver
    params:
      time_limit: 300
      solver: cbc
  baseline:
    class: Baseline
    params:
      strategy: best
instances:
  small:
  - data/instances/small_seed42.yaml
metrics:
- z_value
- gap_percent
- service_level
- avg_inventory
- low_rotation_inventory
- elapsed_seconds
output:
  results_csv: experiments/results/comparison_smoke.csv
  results_json: experiments/results/comparison_smoke.json
  checkpoint_dir: experiments/results/checkpoints_smoke
