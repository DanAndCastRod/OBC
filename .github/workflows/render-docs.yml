name: Render Tesis Coproductos (PDF)

on:
  push:
    branches: [main, master]
    paths:
      - 'tesis/tesis_coproductos.md'
      - 'tesis/referencias_coproductos.bib'
      - 'tesis/ieee.csl'
      - 'tesis/logo_utp.png'
      - '.github/workflows/render-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-pdf:
    runs-on: ubuntu-latest
    name: Render Tesis Coproductos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-spanish \
            librsvg2-bin \
            fonts-liberation \
            fonts-noto

      - name: Install Pandoc
        run: |
          PANDOC_VERSION="3.6.4"
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"
          pandoc --version

      - name: Install pandoc-mermaid filter
        run: |
          sudo npm install -g @mermaid-js/mermaid-cli
          pip install pandoc-mermaid-filter || true

      - name: Render tesis_coproductos.md (PDF)
        run: |
          mkdir -p output
          cd tesis
          pandoc tesis_coproductos.md \
            --pdf-engine=xelatex \
            --citeproc \
            --bibliography=referencias_coproductos.bib \
            --csl=ieee.csl \
            --resource-path=. \
            -V geometry:margin=2.5cm \
            -V fontsize=12pt \
            -V lang=es \
            -V mainfont="Liberation Serif" \
            -V sansfont="Liberation Sans" \
            -V monofont="Liberation Mono" \
            -o ../output/tesis_coproductos.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesis-coproductos-pdf
          path: output/*.pdf
          retention-days: 90

      - name: Commit PDFs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.pdf
          git diff --staged --quiet || git commit -m "docs: render PDFs actualizados [skip ci]"
          git push
